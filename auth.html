<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>注册登录</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/default-data.js"></script>
    <script src="assets/api.js"></script>
    <script src="assets/auth.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-hero">
        <a class="ghost-button" href="index.html">返回首页</a>
        <span class="eyebrow">Account</span>
        <h1>注册登录</h1>
        <p>注册后可以用昵称发布评论和留言。游客无需登录也可以发表内容。</p>
      </header>

      <section class="auth-grid">
        <form class="admin-card auth-card" id="loginForm">
          <h2>用户登录</h2>
          <label>用户名<input name="username" required autocomplete="username" /></label>
          <label>密码<input name="password" required type="password" autocomplete="current-password" /></label>
          <button class="primary-button" type="submit">登录</button>
        </form>

        <form class="admin-card auth-card" id="registerForm">
          <h2>用户注册</h2>
          <label>用户名<input name="username" required autocomplete="username" /></label>
          <label>昵称<input name="nickname" placeholder="不填则使用用户名" /></label>
          <label>密码<input name="password" required type="password" minlength="4" autocomplete="new-password" /></label>
          <button class="primary-button" type="submit">注册并登录</button>
        </form>
      </section>

      <section class="admin-card account-panel">
        <h2>当前身份</h2>
        <p class="muted" id="accountStatus">当前以游客身份访问。</p>
        <div class="admin-actions">
          <a class="ghost-button" href="diary.html">去留言</a>
          <button class="danger-button" id="logoutButton" type="button">退出登录</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="移动端导航">
      <a href="index.html">主页</a>
      <a href="index.html#articles">文章</a>
      <a href="diary.html">留言</a>
      <a href="friends.html">朋友们</a>
      <a href="about.html">我</a>
    </nav>

    <div class="toast" id="toast" role="status"></div>
    <script src="assets/auth-page.js"></script>
  </body>
</html>
